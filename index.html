<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>momo 的基地</title>
  <style>
    :root {
      /* 核心配色：提取自你的头像和二维码 */
      --primary: #4a90e2;
      --primary-light: #eef6ff;
      --accent: #f5c65d; 
      --text-main: #2c3e50;
      --text-sub: #606f7b;
      
      /* 毛玻璃卡片背景 */
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
      
      /* 页面背景渐变 */
      --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    }

    /* 深色模式适配 */
    @media (prefers-color-scheme: dark) {
      :root {
        --text-main: #f1f1f1;
        --text-sub: #a0a0a0;
        --glass-bg: rgba(30, 30, 30, 0.65);
        --glass-border: rgba(255, 255, 255, 0.1);
        --bg-gradient: linear-gradient(135deg, #1a1c20 0%, #0f1012 100%);
        --primary-light: #2c3e50;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* 背景装饰球（营造氛围） */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      opacity: 0.6;
      animation: float 10s infinite ease-in-out;
    }
    .blob-1 { width: 300px; height: 300px; background: #a1c4fd; top: -50px; left: -50px; }
    .blob-2 { width: 250px; height: 250px; background: #fbc2eb; bottom: -50px; right: -50px; animation-delay: -5s; }

    /* 主容器：限制宽度，手机端体验更好 */
    .container {
      width: 100%;
      max-width: 420px;
      z-index: 1;
    }

    /* 头部区域 */
    header {
      text-align: center;
      margin-bottom: 24px;
      animation: fadeInDown 0.8s ease;
    }
    .avatar-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 4px;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }
    .bio { margin: 8px 0 0; color: var(--text-sub); font-size: 0.95rem; }

    /* 通知胶囊 */
    .notice-box {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-sub);
      box-shadow: var(--glass-shadow);
    }
    .notice-icon { font-size: 1.2rem; }

    /* 卡片通用样式 */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--glass-shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeInUp 0.8s ease;
      animation-fill-mode: both;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
    /* 让卡片依次出现 */
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }

    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .card-title { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; font-weight: normal; }
    .tag.primary { background: var(--primary-light); color: var(--primary); }
    .tag.warn { background: #fff5e6; color: #ff9800; }

    .qr-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: zoom-in;
    }
    .qr-img { width: 100%; display: block; border-radius: 12px; }
    
    /* 复制区域 */
    .copy-area {
      margin-top: 15px;
      display: flex;
      background: rgba(0,0,0,0.03);
      padding: 4px;
      padding-left: 16px;
      border-radius: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .qq-num { font-family: monospace; font-size: 1.1rem; color: var(--text-main); letter-spacing: 1px; }
    .copy-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .copy-btn:active { transform: scale(0.96); }

    /* 底部 */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: auto;
      padding-top: 20px;
      opacity: 0.7;
    }
    footer a { color: var(--text-sub); text-decoration: none; border-bottom: 1px dashed currentColor; }

    /* Toast 提示框 */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 放大查看模态框 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .modal img { max-width: 100%; max-height: 90vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

    /* 动画定义 */
    @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(20px, 30px); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="container">
    <header>
      <div class="avatar-wrapper">
        <img class="avatar" src="f0ed53658b736f373e3052c69b01655f.jpg" alt="momo头像" />
      </div>
      <h1>momo 的公告站</h1>
      <p class="bio">✨ 欢迎加入，分享史料与生活 ✨</p>
    </header>

    <div class="notice-box">
      <span class="notice-icon">📢</span>
      <div>最新公告：主群满员请加备用群。</div>
    </div>

    <main>
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span style="color:#FF5722">🔥</span> 官方主群
            <span class="tag primary">活跃</span>
          </div>
        </div>
        <div class="qr-container" onclick="enlarge('4b1d0c20eb48c477ef146c2177560dd8.jpg')">
          <img src="f1800e1d0b82e37b236ea1e53ef6e8b0.jpg" class="qr-img" alt="主群二维码">
        </div>
        <div class="copy-area">
          <span id="qq1" class="qq-num">1045782472</span>
          <button class="copy-btn" onclick="copyText('qq1')">复制</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span>🛡️</span> 备用分群
            <span class="tag warn">防失联</span>
          </div>
        </div>
        <div class="qr-container" onclick="enlarge('ece352ce5ac4221fc6b48d9451923569.jpg')">
          <img src="71fa71204f04d2d0faa3e21920074e18.jpg" class="qr-img" alt="备用群二维码">
        </div>
        <div class="copy-area">
          <span id="qq2" class="qq-num">897570895</span>
          <button class="copy-btn" onclick="copyText('qq2')">复制</button>
        </div>
      </div>
    </main>

    <footer>
      <p>最后更新：2026-1-2 | 访客数：<span id="busuanzi_value_site_pv">--</span></p>
      <p>联系我：<a href="mailto:stillplum@qq.com">stillplum@qq.com</a></p>
    </footer>
  </div>

  <div id="toast">✅ 已复制到剪贴板</div>

  <div class="modal" id="qrModal" onclick="this.style.display='none'">
    <img id="qrImg" src="" alt="放大图片">
  </div>

  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  
  <script>
    // 复制功能优化
    function copyText(id) {
      const text = document.getElementById(id).innerText;
      
      // 使用更现代的 Clipboard API
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(showToast);
      } else {
        // 兼容旧版
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try { document.execCommand('copy'); showToast(); } catch (err) {}
        document.body.removeChild(textArea);
      }
    }

    // 显示 Toast 提示
    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 图片放大
    function enlarge(src) {
      document.getElementById('qrImg').src = src;
      document.getElementById('qrModal').style.display = 'flex';
    }
  </script>
</body>
</html>
